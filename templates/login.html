{% extends "base.html" %} {% block title %}Login - Smart Lost & Found{% endblock
%} {% block content %}

<section class="auth-section">
  <div class="auth-container">
    <!-- HEADER -->
    <div class="auth-header">
      <p class="eyebrow">WELCOME BACK</p>

      <h1>Login to Your Account</h1>

      <p>Access your Smart Lost & Found account.</p>
    </div>

    <!-- LOGIN CARD -->
    <div class="auth-card">
      <form class="auth-form" method="POST" action="{{ url_for('login') }}">
        <!-- EMAIL -->
        <div class="form-group">
          <label for="email"> Email Address </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password"> Password </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit" class="btn btn-primary btn-large auth-button">
          Login
        </button>
      </form>

      <!-- REGISTER LINK -->
      <div class="auth-footer">
        <p>
          Don't have an account?

          <a href="{{ url_for('register') }}"> Create Account </a>
        </p>
      </div>
    </div>
  </div>
</section>

{% endblock %}
